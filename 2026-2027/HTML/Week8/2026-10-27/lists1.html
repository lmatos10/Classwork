<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Practice</title>
    <style>
        /* Write the CSS to set all h2 tags to a color of darkred */
h2{color:darkred}
        /* Write the CSS to set all li tags inside of a ol to be the color green*/
ol>li{color:green}
        /* Write the CSS to set all items with brownText to the color brown */
.brownText{color:brown}
        /* Set the background color of article1 to gray */
#article1{background-color:gray}
        /* Write the CSS to set the footer background color to purple */
footer{background-color:purple}
        /* Write the CSS to set the background color of article2 to black and the text color to white */
        #article2{background-color:black;color:white}
        /* Write the CSS to set the header background color to blue */

        /* Write the CS
        S to set the h1 text color to white */

    </style>
</head>
<body>
<header>
    <h1>CSS Practice</h1>
</header>
<main>
    <article id="article1">
        <h2>First Article</h2>
        <p>First article text.</p>
        <ol>
            <li>First item</li>
            <li>Second item</li>
            <li>Third item</li>
        </ol>
    </article>
    <article id="article2">
        <h2>Second Article</h2>
        <p>Second article text.</p>
        <ol>
            <li>First item</li>
            <li>Second item</li>
            <li>Third item</li>
        </ol>
    </article>
    <article id="article3">
        <h2>Third Article</h2>
        <p>Third article text.</p>
        <ul class="brownText">
            <li>First item</li>
            <li>Second item</li>
            <li>Third item</li>
        </ul>
    </article>
</main>
<footer id="footer">
    <h3 class="brownText">Footer Text</h3>
</footer>
</body>
</html>
